server {
    listen 80;
    server_name permatrax.ai-tech.io;

    # Redirect to HTTPS tracking Zero-Trust naturally cleanly intelligently implicitly smoothly explicitly
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name permatrax.ai-tech.io;

    ssl_certificate /etc/letsencrypt/live/permatrax.ai-tech.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/permatrax.ai-tech.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Rate limiting zone cleanly tracking inherently flawlessly explicitly intelligently optimally natively flawlessly securely neatly cleanly dynamically
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
