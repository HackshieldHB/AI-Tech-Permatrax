# ── Rate limiting — must be in http context ──────────────────────────────────
limit_req_zone $binary_remote_addr zone=permatrax_api:10m rate=10r/s;

# ── WebSocket upgrade map ─────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aitech-ilt.co.id www.aitech-ilt.co.id;
    return 301 https://aitech-ilt.co.id$request_uri;
}

# ─── www → non-www redirect (HTTPS) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aitech-ilt.co.id;

    ssl_certificate     /etc/letsencrypt/live/aitech-ilt.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aitech-ilt.co.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://aitech-ilt.co.id$request_uri;
}

# ─── HTTPS (canonical — non-www only) ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aitech-ilt.co.id;

    ssl_certificate     /etc/letsencrypt/live/aitech-ilt.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aitech-ilt.co.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Lowercase /permatrax → canonical /Permatrax redirect ────────────────
    # nginx prefix locations are case-sensitive; add a regex redirect so that
    # /permatrax, /permatrax/login, etc. all resolve correctly.
    # Note: ~ is CASE-SENSITIVE regex, so this ONLY matches all-lowercase
    # variants and does NOT create a loop for the canonical /Permatrax paths.
    location ~ ^/permatrax(/.*)?$ {
        return 301 https://aitech-ilt.co.id/Permatrax$1$is_args$args;
    }

    # ── Permatrax Next.js Route Handlers ────────────────────────────────────
    # These paths look like API paths but are handled by Next.js (port 3002),
    # not NestJS. Must be declared with ^~ BEFORE the /Permatrax/api/ block
    # so nginx's longest-prefix match routes them to Next.js, not Nest.
    location ^~ /Permatrax/api/auth/set-cookie {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /Permatrax/api/auth/clear-cookie {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /Permatrax/api/auth/refresh {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Permatrax DEV — API (NestJS @ :3003) ────────────────────────────────
    # MUST be declared before /Permatrax so nginx matches it first
    location /Permatrax/api/ {
        limit_req zone=permatrax_api burst=20 nodelay;

        # Strip /Permatrax prefix — NestJS expects /api/...
        rewrite ^/Permatrax(.*)$ $1 break;
        proxy_pass http://localhost:3003;

        proxy_http_version 1.1;

        # WebSocket support (Socket.io)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # ── Permatrax DEV — Web (Next.js @ :3002) ───────────────────────────────
    location /Permatrax {
        proxy_pass http://localhost:3002;

        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR / live reload)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # ── AI Tech Website static assets (long cache, immutable) ───────────────
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Static chunks are content-hashed — safe to cache long term
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── AI Tech Website (Next.js @ :3000) ───────────────────────────────────
    location / {
        proxy_pass http://localhost:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Override upstream cache header — prevent browser caching HTML entirely
        # (avoids stale/corrupt cached responses after nginx config changes)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # Buffer settings untuk handle large Next.js responses (114KB+)
        proxy_buffering        on;
        proxy_buffer_size      128k;
        proxy_buffers          8 256k;
        proxy_busy_buffers_size 256k;

        proxy_read_timeout     300s;
        proxy_connect_timeout  75s;
    }
}
